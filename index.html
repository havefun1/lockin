<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lock In">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<title>Lock In</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#09090b; --card:#1b1b1e; --card2:#2a2a2e; --line:rgba(255,255,255,.08);
  --accent:#ff6b1a; --ok:#33d973; --warn:#ffcc38; --bad:#ff5252;
  --text:#f5f5f7; --muted:#9b9ba3; --r:22px;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none}
a.btn,label.btn{font:inherit;color:inherit;text-decoration:none;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;cursor:default}
[data-a]{cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:0;border-radius:14px;padding:13px 14px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus{box-shadow:0 0 0 2px var(--accent)}
.screen{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px)}
.screen.center{text-align:center;padding-bottom:40px}
h1{font:800 34px/1.1 var(--round);margin:2px 0 14px;letter-spacing:-.5px}
h1.mega{font-size:52px;font-weight:900;letter-spacing:1px;margin:6px 0 10px}
p{margin:0 0 12px}
.lead{font-size:18px}
.greet{color:var(--muted);font-weight:600;font-size:18px;margin-top:4px}
.muted{color:var(--muted)} .sm{font-size:15px} .xs{font-size:13px;line-height:1.35} .block{display:block}
.acc{color:var(--accent)} .okc{color:var(--ok)} .warnc{color:var(--warn)}
.mono{font-variant-numeric:tabular-nums}
.center{text-align:center}
.card{display:block;width:100%;background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card > * + *{margin-top:12px}
.card.inset{background:var(--card2);border-radius:18px;padding:12px 14px}
.card.note{font-size:15px;color:#d8d8de}
.card.warnnote{border:1px solid rgba(255,204,56,.4)}
.card.dim{opacity:.72}
.row{display:flex;align-items:center;gap:12px}
.row.top{align-items:flex-start}
.row.gap{gap:10px}
.grow{flex:1;min-width:0}
.sh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:6px 2px 8px}
.sh .link{text-transform:none;letter-spacing:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title{font:800 36px/1.1 var(--round);letter-spacing:-.5px}
.title.sm{font-size:24px}
.big{font:800 32px/1.1 var(--round)}
.ficon{font-size:34px;line-height:1}
.flame{font-size:42px;filter:grayscale(1) opacity(.45)}
.flame.on{filter:none}
.lvl{text-align:right}.lvl span{display:block;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted)}.lvl b{font:800 28px var(--round)}
.bar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .3s}
.bar.thin{height:5px;margin-top:10px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 12px}
.deadline{font-size:13px;font-weight:600;color:var(--muted)}
.deadline.warn{color:var(--warn)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left}
.li:last-child{border-bottom:0}
a.li{color:inherit;text-decoration:none}
.card.inset .li{padding:11px 0}
.li .play{color:var(--accent);font-size:13px}
.li .wd{width:40px;font-weight:700;color:var(--muted);font-size:15px}
.li .wd.acc{color:var(--accent)}
.li .fi,.row .fi{width:26px;text-align:center;font-size:20px}
.li select{padding:9px 34px 9px 12px;border-radius:12px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:17px;text-align:center;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.primary{background:var(--accent);color:#000}
.btn.okbtn{background:var(--ok);color:#000}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:rgba(255,82,82,.15);color:var(--bad)}
.btn.small{padding:11px 14px;font-size:15px;width:auto}
.btn + .btn{margin-top:10px}
.link{color:var(--accent);font-weight:600}
.actions{display:flex;gap:10px}
.act{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card2);border-radius:14px;padding:10px 4px;font-size:12px;font-weight:600;text-align:center}
.act b{font-size:18px;font-weight:400}
.week{display:flex;gap:4px}
.wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700}
.wday small{font-size:10px;font-weight:600}
.bub{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;color:#000;font-weight:800}
.ring{box-shadow:inset 0 0 0 2px var(--accent)}
ul.plain{list-style:none;padding:0;margin:0}ul.plain li{padding:5px 0;color:#d8d8de}
ol.how{margin:0;padding-left:20px}ol.how li{margin:6px 0;font-size:15px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 8px calc(env(safe-area-inset-bottom) + 6px);background:rgba(16,16,18,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);flex:1;padding:2px 0}
.tab span{font-size:22px;filter:grayscale(1) opacity(.55)}
.tab.on{color:var(--accent)}.tab.on span{filter:none}
/* onboarding */
.ob .dots{display:flex;gap:6px;margin:4px 0 22px}
.ob .dots i{flex:1;height:4px;border-radius:4px;background:var(--card2)}
.ob .dots i.on{background:var(--accent)}
.hero-flame{font-size:64px;margin-top:8px}
.field{display:block}.field > span{display:block;font-weight:700;margin:0 0 8px}
.card .field + .field{margin-top:14px}
.ob-nav{display:flex;gap:12px;position:sticky;bottom:0;padding:16px 0 calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(transparent,var(--bg) 30%)}
.ob-nav .ghost{width:120px;flex:none}
.ob-nav .btn + .btn{margin-top:0}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;border:2px solid transparent}
.choice.sel{border-color:var(--accent);background:var(--card2)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:14px;flex:none;margin-top:2px}
.choice.sel .radio{border-color:var(--accent)}
.steps{text-align:left}.step{display:flex;gap:12px;align-items:center;padding:6px 0}
.step b{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;flex:none}
.shareglyph{display:inline-block;border:1.5px solid currentColor;border-radius:5px;padding:0 4px;font-size:13px}
/* controls */
.toggle-row,.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.switch{width:51px;height:31px;border-radius:31px;background:var(--card2);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.switch.on{background:var(--ok)}.switch.on i{transform:translateX(20px)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;text-align:center;color:var(--muted)}
.seg button.on{background:#48484f;color:var(--text)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{padding:10px 0;border-radius:20px;background:var(--card2);font-weight:600;text-align:center}
.chip.on{background:var(--accent);color:#000}
.stepbtns{display:flex;align-items:center;background:var(--card2);border-radius:20px}
.stepbtns button{width:40px;height:38px;font-size:20px;text-align:center}
.stepbtns b{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.mini{width:34px;height:34px;border-radius:10px;background:var(--card2);text-align:center;font-size:14px}
.pill{display:inline-block;background:var(--card2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--text);letter-spacing:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}
/* overlays */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(9,9,11,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.pad{max-width:560px;margin:0 auto;padding:6px 16px calc(env(safe-area-inset-bottom) + 30px)}
.pad > .bar{margin:10px 0 16px}
.ex-name{font-weight:700;font-size:17px}
.struck{text-decoration:line-through;color:var(--muted)}
.formbtn{background:rgba(255,107,26,.16);color:var(--accent);font-weight:700;font-size:14px;padding:8px 12px;border-radius:12px;flex:none}
.adjs{display:flex;gap:14px;flex-wrap:wrap}
.adj{display:flex;flex-direction:column;align-items:center;gap:4px}
.adj small{font-size:11px}
.adjbox{display:flex;align-items:center;background:var(--card2);border-radius:22px}
.adjbox button{width:40px;height:40px;font-size:20px;text-align:center}
.adjbox b{min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.sets{display:flex;gap:10px;flex-wrap:wrap}
.setb{width:52px;height:52px;border-radius:50%;background:var(--card2);font-weight:800;font-size:18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.setb small{font-size:10px;margin-top:2px}
.setb.done{background:var(--ok);color:#000}
.fb .fbrow{display:flex;gap:8px;margin:8px 0 6px}
.fbrow button{flex:1;padding:11px 4px;border-radius:12px;background:var(--card2);font-weight:700;font-size:14px;text-align:center}
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);background:rgba(28,28,32,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.timerbar .row{max-width:560px;margin:0 auto}
.tlabel{font-size:12px;font-weight:800;letter-spacing:1px;width:72px}
.tval{flex:1;font:800 34px var(--round)}
.tbtn{padding:10px 14px;border-radius:12px;background:var(--card2);font-weight:700}
.tbtn.solid{color:#000}
.timer-space{height:110px}
.hidden{display:none!important}
.minis{display:flex;gap:10px}
.minis div{flex:1;background:var(--card2);border-radius:14px;padding:10px 4px;text-align:center}
.minis b{display:block;font:800 22px var(--round)}.minis small{color:var(--muted);font-size:12px}
.lock{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1.5px solid transparent}
.lock.on{border-color:rgba(51,217,115,.45);background:rgba(51,217,115,.08)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:none;font-weight:900;color:#000}
.lock.on .check{background:var(--ok);border-color:var(--ok)}
.cue{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.cue b{width:28px;height:28px;border-radius:50%;background:rgba(255,107,26,.2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-wrap.anim .backdrop{animation:fade .2s}
.sheet{position:relative;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#141416;border-radius:24px 24px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px);width:100%;max-width:600px;margin:0 auto}
.sheet > * + *{margin-top:12px}
.grabber{width:40px;height:5px;border-radius:5px;background:#3a3a3f;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-8px;background:#141416;padding:8px 0;z-index:1;font-size:17px}
.sheet-wrap.anim .sheet{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tiles .card{margin:0}
.tile span{font-size:22px}.tile b{display:block;font:800 34px/1.1 var(--round)}
.tile small{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.8px}
.tile em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.tile > * + *{margin-top:2px}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calgrid.head span{text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.cal{height:40px;border-radius:10px;font-size:15px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);background:rgba(40,40,44,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:11px 18px;border-radius:24px;font-weight:600;font-size:15px;z-index:100;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<noscript><p style="padding:20px">Lock In needs JavaScript turned on.</p></noscript>
<script src="library.js"></script>
<script src="app.js"></script>
</body>
</html>
